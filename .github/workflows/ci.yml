name: CI

# Prüft jeden Pull Request und jeden Push auf main: Spec-Tests, Build und Dokumentation (prüft auch, dass jede
# Komponente in der Navigation steht). Nur lesend: keine Secrets, kein pull_request_target, also läuft auch Code
# aus Forks gefahrlos. Der Job e2e läuft parallel dazu die Browser-Tests mit Playwright (Chromium, Firefox, WebKit).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ein neuer Push bricht den alten Lauf desselben PRs (bzw. Branches) ab; verschiedene PRs laufen unabhängig.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser je Playwright-Version zwischenspeichern; die Systempakete installiert install-deps jedes Mal.
      - name: Playwright-Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # apt soll bei einem hängenden Mirror nicht bis zum Job-Timeout warten: kurze Zeitlimits, Retries und eine
      # Mirror-Liste (Azure des Runners zuerst, dann archive.ubuntu.com, dann kernel.org). Security-Quellen bleiben.
      - name: APT – Mirror-Fallback und Zeitlimits
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          printf '%s\tpriority:1\n%s\tpriority:2\n%s\tpriority:3\n' \
            http://azure.archive.ubuntu.com/ubuntu/ \
            http://archive.ubuntu.com/ubuntu/ \
            http://mirrors.edge.kernel.org/ubuntu/ | sudo tee /etc/apt/ci-mirrors.txt >/dev/null
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            [ -f "$f" ] && sudo sed -i -E 's#https?://azure\.archive\.ubuntu\.com/ubuntu/?#mirror+file:/etc/apt/ci-mirrors.txt#g' "$f"
          done
          grep -rh "ci-mirrors" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null || echo "::warning::Keine Azure-Quelle gefunden – Mirror-Fallback nicht aktiv"
      # Jeder Versuch höchstens 5 Minuten, bis zu 3 Versuche; mit Cache nur die Systempakete.
      - name: Playwright – Browser und Systempakete
        timeout-minutes: 16
        env:
          INSTALL: ${{ steps.browsers.outputs.cache-hit == 'true' && 'install-deps' || 'install --with-deps' }}
        run: |
          for attempt in 1 2 3; do
            if timeout 5m npx playwright $INSTALL chromium firefox webkit; then exit 0; fi
            echo "::warning::playwright $INSTALL – Versuch $attempt fehlgeschlagen oder abgebrochen"
            sleep 10
          done
          exit 1
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
