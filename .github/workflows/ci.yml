name: CI

# Prüft jeden Pull Request und jeden Push auf main: Spec-Tests, Build und Dokumentation (prüft auch, dass jede
# Komponente in der Navigation steht). Nur lesend: keine Secrets, kein pull_request_target, also läuft auch Code
# aus Forks gefahrlos. Der Job e2e läuft parallel dazu die Browser-Tests mit Playwright (Chromium, Firefox, WebKit) im Playwright-Container.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ein neuer Push bricht den alten Lauf desselben PRs (bzw. Branches) ab; verschiedene PRs laufen unabhängig.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs

  # Version von @playwright/test aus package.json, damit das Container-Image immer zur Testbibliothek passt.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: v
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  # Läuft im offiziellen Playwright-Image: Browser und Systempakete sind vorinstalliert, es gibt kein apt und keinen
  # Download pro Lauf, also keine Abhängigkeit von Ubuntu-Mirrors (#167). --user 1001 = Runner-User (Workspace-Rechte).
  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
