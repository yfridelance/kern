<!doctype html>
<html lang="de-CH" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>e2e: Select und Combobox</title>
  <link rel="stylesheet" href="kern/kern.css">
  <script type="module" src="kern/kern.esm.js"></script>
  <style>body { padding: 24px; display: grid; gap: 16px; max-width: 360px; }</style>
</head>
<body>
  <h1>Popover</h1>
  <p id="outside">Ausserhalb</p>
  <button id="before">Davor</button>
  <kern-select label="Raum" name="room">
    <option value="kitchen">Küche</option>
    <option value="bath" selected>Bad</option>
    <option value="garage">Garage</option>
    <option value="office">Büro</option>
  </kern-select>
  <kern-input label="Gerät" name="device" suggestions="Bad Lüftung,Küche Licht,Rollladen Süd,Bad Heizung"></kern-input>
  <button id="after">Danach</button>
</body>
</html>
