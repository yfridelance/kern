name: CI

# Prüft jeden Pull Request und jeden Push auf main: Spec-Tests, Build und Dokumentation (prüft auch, dass jede
# Komponente in der Navigation steht). Nur lesend: keine Secrets, kein pull_request_target, also läuft auch Code
# aus Forks gefahrlos. Der Job e2e läuft parallel dazu die Browser-Tests mit Playwright (Chromium, Firefox, WebKit).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Ein neuer Push bricht den alten Lauf desselben PRs (bzw. Branches) ab; verschiedene PRs laufen unabhängig.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run docs

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Browser je Playwright-Version zwischenspeichern; die Systempakete installiert install-deps jedes Mal.
      - name: Playwright-Version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # apt soll bei einem hängenden Mirror nicht bis zum Job-Timeout warten: kurze Zeitlimits, Retries und eine
      # Mirror-Liste. Die GitHub-Runner nutzen schon `mirror+file:/etc/apt/apt-mirrors.txt` (Azure, archive.ubuntu.com);
      # dort hängen wir kernel.org an. Ältere Images mit direkter Azure-Quelle stellen wir auf dieselbe Liste um.
      # Security-Quellen bleiben unverändert.
      - name: APT – Mirror-Fallback und Zeitlimits
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null <<'EOF'
          Acquire::Retries "3";
          Acquire::http::Timeout "20";
          Acquire::https::Timeout "20";
          Acquire::ftp::Timeout "20";
          EOF
          list=/etc/apt/apt-mirrors.txt
          if ! grep -rqs "mirror+file:$list" /etc/apt/sources.list /etc/apt/sources.list.d/; then
            printf '%s\n' http://azure.archive.ubuntu.com/ubuntu/ http://archive.ubuntu.com/ubuntu/ | sudo tee "$list" >/dev/null
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              [ -f "$f" ] && sudo sed -i -E "s#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#mirror+file:$list#g" "$f"
            done
          fi
          grep -qs 'mirrors.edge.kernel.org' "$list" || echo 'http://mirrors.edge.kernel.org/ubuntu/' | sudo tee -a "$list" >/dev/null
          echo "Mirror-Liste ($list):"; cat "$list"
          grep -rhs "mirror+file:$list" /etc/apt/sources.list /etc/apt/sources.list.d/ >/dev/null \
            || echo "::warning::Ubuntu-Quellen nutzen $list nicht – Mirror-Fallback nicht aktiv"
      # Jeder Versuch höchstens 5 Minuten, bis zu 3 Versuche; mit Cache nur die Systempakete.
      - name: Playwright – Browser und Systempakete
        timeout-minutes: 16
        env:
          INSTALL: ${{ steps.browsers.outputs.cache-hit == 'true' && 'install-deps' || 'install --with-deps' }}
        run: |
          for attempt in 1 2 3; do
            if timeout 5m npx playwright $INSTALL chromium firefox webkit; then exit 0; fi
            echo "::warning::playwright $INSTALL – Versuch $attempt fehlgeschlagen oder abgebrochen"
            sleep 10
          done
          exit 1
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
